<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sandbox</title>
  <!-- Deliberately empty: demos are shared by direct link only, so the root
       never lists them and one client can't browse to another's demo. -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f7f9;
      color: #6b7280;
      font: 15px/1.5 system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111318; color: #9ca3af; }
    }
  </style>
</head>
<body>
  <p>Sandbox</p>
</body>
</html>
